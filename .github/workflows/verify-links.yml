name: Verify links
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open the live site without signing in
        run: |
          for path in / /talking-points/ /paper/indian-express/ /section/markets/ /robots.txt /favicon.svg; do
            code=$(curl -s -o /tmp/page -w '%{http_code} %{url_effective}' "https://dak-edition.vercel.app$path")
            title=$(grep -o '<title>[^<]*' /tmp/page | head -1)
            echo "RESULT $code $title"
          done
          curl -s https://dak-edition.vercel.app/ | grep -o 'Filed [0-9:]* [AP]M IST' | head -1 | sed 's/^/RESULT /'
