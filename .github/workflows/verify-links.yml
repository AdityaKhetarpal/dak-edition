name: Verify links
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - name: Open a Google News link from each paper
        run: |
          cat > /tmp/verify.mjs <<'SCRIPT'
          import { createRequire } from 'node:module';
          import { readFileSync } from 'node:fs';
          const require = createRequire(process.cwd() + '/');
          const { chromium } = require('playwright');
          const edition = JSON.parse(readFileSync('data/edition.json', 'utf8'));
          const browser = await chromium.launch();
          for (const paper of ['indian-express', 'business-standard', 'financial-express', 'telegraph']) {
            const story = edition.stories.find((item) => item.paper === paper && item.section === 'opinion');
            const page = await browser.newPage();
            await page.goto(story.url, { waitUntil: 'domcontentloaded', timeout: 30000 }).catch((e) => console.log('goto:', e.message));
            await page.waitForURL((url) => !url.hostname.endsWith('news.google.com'), { timeout: 20000 }).catch(() => {});
            console.log(`RESULT ${paper}: ${page.url().slice(0, 120)}`);
            await page.close();
          }
          await browser.close();
          SCRIPT
          node /tmp/verify.mjs
