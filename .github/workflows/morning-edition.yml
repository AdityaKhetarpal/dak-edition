name: Morning edition

on:
  schedule:
    # Cron times are UTC. GitHub can start scheduled runs late or drop them, so
    # there are several chances. The first one that works files the edition, and
    # the rest stop straight away.
    - cron: '20 2 * * *' # 7:50 AM IST
    - cron: '35 2 * * *' # 8:05 AM IST
    - cron: '50 2 * * *' # 8:20 AM IST
    - cron: '10 3 * * *' # 8:40 AM IST
    - cron: '40 3 * * *' # 9:10 AM IST
    - cron: '40 4 * * *' # 10:10 AM IST
    - cron: '40 6 * * *' # 12:10 PM IST
    - cron: '*/10 * * * *' # Temporary: proves the schedule fires
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morning-edition
  cancel-in-progress: false

jobs:
  file-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the papers
        env:
          SKIP_IF_FILED_TODAY: ${{ github.event_name == 'schedule' }}
        run: npm run file-edition
      - name: Publish the edition
        run: |
          git add data/edition.json
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git config user.name "Aditya Khetarpal"
          git config user.email "80028073+AdityaKhetarpal@users.noreply.github.com"
          git commit -m "Edition of $(TZ=Asia/Kolkata date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
