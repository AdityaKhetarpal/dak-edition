name: Inspect once
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect
        run: |
          cat > scripts/inspect-once.mjs <<'SCRIPT'
          import { fetchText } from '../lib/http.mjs';
          import { parseFeed } from '../lib/feed.mjs';
          const age = (iso) => Math.round((Date.now() - Date.parse(iso)) / 86_400_000);
          const google = 'https://news.google.com/rss/search?q=site:timesofindia.indiatimes.com/blogs+when:30d&hl=en-IN&gl=IN&ceid=IN:en';
          for (const item of parseFeed((await fetchText(google)).text).slice(0, 16)) console.log(`RESULT ${age(item.publishedAt)}d ${item.title.slice(0, 80)}`);
          const page = await fetchText('https://timesofindia.indiatimes.com/blogs/edit-page/?ch=toi', { attempts: 1 });
          const dates = [...page.text.matchAll(/\b(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},\s+2026/g)].map((m) => m[0]);
          const count = dates.reduce((all, date) => ({ ...all, [date]: (all[date] ?? 0) + 1 }), {});
          console.log(`RESULT edit page dates ${JSON.stringify(count).slice(0, 400)}`);
          SCRIPT
          node scripts/inspect-once.mjs
