name: Inspect once
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Inspect
        run: |
          cat > scripts/inspect-once.mjs <<'SCRIPT'
          import { fetchText } from '../lib/http.mjs';
          const page = await fetchText('https://timesofindia.indiatimes.com/rss.cms', { attempts: 2 });
          const rows = [...page.text.matchAll(/href="([^"]*rssfeeds[^"]*)"[^>]*>([^<]*)</g)].map((m) => `${m[2].trim()} ${m[1]}`);
          console.log(`RESULT rss.cms size ${page.text.length}, feed links ${rows.length}`);
          console.log(`RESULT ${rows.filter((row) => /opinion|edit|blog|view|column/i.test(row)).join(' || ').slice(0, 900)}`);
          const blog = await fetchText('https://timesofindia.indiatimes.com/blogs/toi-editorials/', { attempts: 1 });
          const anchors = [...blog.text.matchAll(/<a[^>]+href="(https:\/\/timesofindia\.indiatimes\.com\/blogs\/[^"]+)"[^>]*>([^<]{12,})</g)].map((m) => `${m[2].trim().slice(0, 50)} ${m[1].slice(38, 100)}`);
          console.log(`RESULT anchors ${anchors.length}`);
          for (const anchor of anchors.slice(0, 14)) console.log(`RESULT   ${anchor}`);
          const years = [...blog.text.matchAll(/\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+\d{1,2},?\s+2026/g)].map((m) => m[0]);
          console.log(`RESULT dates on page ${[...new Set(years)].slice(0, 8).join(', ')}`);
          SCRIPT
          node scripts/inspect-once.mjs
